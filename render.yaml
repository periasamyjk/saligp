services:
  - type: web
    name: saligp-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn saligp.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SALIGP_MODEL_PATH
        value: saligp/outputs/saligp_igp_model.pkl
